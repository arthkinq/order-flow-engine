services:
  postgres:
    image: postgres:16-alpine
    container_name: order_flow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_flow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_flow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: order_flow_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Web Management Dashboard UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    container_name: order_flow_api
    environment:
      DB_CONN_STRING: "postgres://postgres:postgres@postgres:5432/order_flow?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      GATEKEEPER_URL: "gatekeeper:50052"
      GRPC_SERVER_PORT: ":50051"
    ports:
      - "50051:50051"
      - "2112:2112" # Prometheus metrics endpoint
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    container_name: order_flow_worker
    environment:
      DB_CONN_STRING: "postgres://postgres:postgres@postgres:5432/order_flow?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      WORKER_COUNT: "3"
    ports:
      - "2113:2113" # Prometheus metrics endpoint
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: order_flow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
